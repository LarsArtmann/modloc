name: CI

# Forgejo Actions, native runner (this repository is Forgejo-canonical; see
# AGENTS.md, "Remotes"). One BuildFlow full gate covers the build, vet, the
# race-enabled tests, golangci-lint, govulncheck, cmdguard-lint and the Nix
# flake checks. The second step runs the gates BuildFlow does not own: the
# secret scan, the STACK.md drift check, and this repository's two gates.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: buildflow full gate + repo gates
    runs-on: native
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install BuildFlow
        run: |
          nix --accept-flake-config profile install github:LarsArtmann/BuildFlow/28ad281b1cdf2d640fbf7d9d98dcf78256d5776d
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: BuildFlow full gate
        env:
          BUILDFLOW_TELEMETRY_DISABLED: "true"
        run: buildflow --build-mode full

      - name: Secret scan
        env:
          BUILDFLOW_TELEMETRY_DISABLED: "true"
        run: buildflow -s gitleaks

      - name: STACK.md drift check
        run: bash "$HOME/.agents/skills/stack-selection/scripts/stack-drift-check.sh" .

      - name: Spec-count gate
        run: bash scripts/test-count.sh

      - name: Coverage floor
        run: bash scripts/coverage-floor.sh
