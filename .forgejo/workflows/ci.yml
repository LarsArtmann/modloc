name: CI

# Forgejo Actions on the native runner (this repository is Forgejo-canonical;
# see AGENTS.md, "Remotes"). Every step is hermetic Nix: the flake's dev shell
# for the race-enabled specs, then the flake checks, which cover the package
# (its build runs the specs with the real scc), lint, format, both modules,
# the wrapped binary, the STACK.md drift and the secret scan. Last come the
# gates BuildFlow does not own: the spec count in FEATURES.md and the
# coverage floor.
#
# BuildFlow is not run here. It is private on GitHub and the runner has no
# token for it; its full gate is the local loop (`buildflow --build-mode
# full`) before a push.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: flake checks + repo gates
    runs-on: native
    timeout-minutes: 30
    env:
      # Never download a toolchain into a module cache the runner's user cannot write.
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Race-enabled specs
        run: nix develop --command go test -race -count=1 ./...

      - name: Nix flake check
        run: nix flake check -L

      - name: Spec-count gate
        run: bash scripts/test-count.sh

      - name: Coverage floor
        run: nix develop --command bash scripts/coverage-floor.sh
